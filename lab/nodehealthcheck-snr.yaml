# Lab: armed NHC pointing at SNR, for the auto-detection experiment (needs lab/snr-operator.yaml).
# duration is short (90s) so the lab does not take all afternoon. Do not copy that to production.
# In the lab this NHC detected the dead node and then REFUSED to remediate it, because the worker
# carried the node-role.kubernetes.io/control-plane label (etcd quorum guard).
apiVersion: remediation.medik8s.io/v1alpha1
kind: NodeHealthCheck
metadata:
  name: nhc-snr
spec:
  minHealthy: "51%"
  selector:
    matchExpressions:
      - key: node-role.kubernetes.io/worker
        operator: Exists
  unhealthyConditions:
    - type: Ready
      status: Unknown
      duration: 90s
    - type: Ready
      status: "False"
      duration: 90s
  remediationTemplate:
    apiVersion: self-node-remediation.medik8s.io/v1alpha1
    kind: SelfNodeRemediationTemplate
    name: self-node-remediation-automatic-strategy-template   # created by the SNR operator
    namespace: openshift-workload-availability
